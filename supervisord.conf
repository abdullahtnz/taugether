# taugether — supervisor config
# Runs the Go API and nginx together inside a single container.
# The API listens only on the loopback interface (BACKEND_PORT) and is exposed
# to the world by nginx, which listens on the externally reachable PORT.

[supervisord]
nodaemon=true
user=root
logfile=/tmp/supervisord.log
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:backend]
command=/app/server
directory=/app
environment=PORT="%(ENV_BACKEND_PORT)s"
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
